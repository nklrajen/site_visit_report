name: site_visit_report
description: Axiom Technical Services - Site Visit Report App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # Location
  geolocator: ^11.0.0
  url_launcher: ^6.2.6

  # Camera & Image
  image_picker: ^1.1.2
  path_provider: ^2.1.3

  # Signature
  signature: ^5.4.1

  # Export
  csv: ^6.0.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
